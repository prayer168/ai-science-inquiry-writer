interface:
  display_name: "AI 與科學探究文章生成"
  short_description: "查證並撰寫 AI 科學探究文章，輸出雙檔、Pages 網頁與 Codex 一鍵複製"
  default_prompt: "使用 $ai-science-inquiry-writer，根據我的主題撰寫有資料來源的繁體中文文章，以主題相關英文檔名輸出可下載的純文字與純閱讀版 HTML，把 HTML 部署到 prayer168/docs GitHub Pages，並在 Codex 回覆中提供公開網頁連結與一鍵複製全文。"
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
